name: Silent Payments conformance
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  conformance:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install --no-build-isolation .
      - run: python -m devtools.selftest
      - run: python examples/derive.py
      - run: python examples/keys.py
# No daemon download or mining on GitHub-hosted infrastructure.
# Run the documented regtest command locally on trusted hardware.
