name: WSP-1 conformance
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  software:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install --no-build-isolation .
      - run: python -m ruff format --check src devtools tests fuzz benchmarks examples scripts
      - run: python -m ruff check src devtools tests fuzz benchmarks examples scripts
      - run: python -m devtools.selftest
      - run: wsp-conformance test --contract-only
      - run: python -m devtools.differential --cases 10000
      - run: python fuzz/run.py fuzz/corpus -artifact_prefix=fuzz/regressions/ -runs=10000 -rss_limit_mb=1024
      - run: python -m pip_audit -r requirements-lock.txt
      - run: python -m devtools.build_check
  full-qualification:
    # Trusted owner-triggered hardware only. Never execute PR code on this runner.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: software
    runs-on: [self-hosted, linux, wsp-regtest]
    timeout-minutes: 45
    env:
      WAMD: ${{ vars.WAMD }}
      WAMD_SHA256: ${{ vars.WAMD_SHA256 }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python3 -m venv .venv
      - run: .venv/bin/python -m pip install -r requirements-dev.txt
      - run: .venv/bin/python -m pip install --no-build-isolation . ./integration-deps/wam-sdk
      - run: .venv/bin/python scripts/qualify.py
      - run: .venv/bin/wsp-conformance test --release --output reports/release-gate.json
# No release/tag action: protected branch settings and maintainer release decisions
# must require the full gate. Pending independent review/adoption keeps it red.
